[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2vector"
version = "0.1.0"
description = "Generic patient-timeline video and EEG feature pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.3",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "ultralytics>=8.3",
  "lapx>=0.5.12",
  "edfio>=0.4",
  "mediapipe>=0.10.14",
  "soundfile>=0.12",
  "librosa>=0.10",
  "mne>=1.6",
  "scipy>=1.11",
  "requests>=2.31",
  "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
video2vector = "video2vector.cli:main"
video2vector-ui = "video2vector.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
